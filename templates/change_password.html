
<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — SecureVault</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Typography: Plus Jakarta Sans (UI & Display), JetBrains Mono (Data & Hashes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Immediate Theme Initialization Script (Prevents Flickering) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const theme = savedTheme ? savedTheme : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <style>
        /* ================= THEME COLOR VARIABLES ================= */
        :root, [data-theme="dark"] {
            --bg-body: #060913;
            --bg-card: rgba(15, 23, 42, 0.55);
            --bg-card-hover: rgba(30, 41, 59, 0.65);
            --bg-glass: rgba(9, 13, 22, 0.75);
            --bg-input: rgba(9, 13, 22, 0.6);
            --bg-header: rgba(15, 23, 42, 0.4);

            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.18);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-heading: #ffffff;

            --bg-gradient-overlay: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(20, 184, 166, 0.12), transparent),
                radial-gradient(circle at 100% 40%, rgba(99, 102, 241, 0.08), transparent 40%),
                radial-gradient(circle at 0% 80%, rgba(168, 85, 247, 0.06), transparent 40%),
                radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);

            --brand-gradient: linear-gradient(135deg, #ffffff 30%, var(--accent-teal) 100%);
        }

        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 0.98);
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-input: #ffffff;
            --bg-header: rgba(241, 245, 249, 0.8);

            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.18);

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --text-heading: #020617;

            --bg-gradient-overlay: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(20, 184, 166, 0.1), transparent),
                radial-gradient(circle at 100% 40%, rgba(99, 102, 241, 0.05), transparent 40%),
                radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px);

            --brand-gradient: linear-gradient(135deg, #0f172a 30%, #0d9488 100%);
        }

        /* Brand Accent System */
        :root {
            --accent-teal: #14b8a6;
            --accent-teal-glow: rgba(20, 184, 166, 0.15);
            
            --accent-blue: #0284c7;
            --accent-blue-glow: rgba(2, 132, 199, 0.15);

            --accent-gold: #d97706;
            --accent-gold-glow: rgba(217, 119, 6, 0.15);

            --accent-danger: #dc2626;

            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-pill: 9999px;

            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* Ambient background */
        body {
            background-color: var(--bg-body) !important;
            background-image: var(--bg-gradient-overlay);
            background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px;
            background-attachment: fixed;
            color: var(--text-primary) !important;
            font-family: var(--font-sans) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* Responsive text colors in Light vs Dark mode */
        [data-theme="light"] .text-white {
            color: var(--text-heading) !important;
        }

        /* ================= FLOATING NAVBAR ================= */
        .navbar-custom {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 0 !important;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2), rgba(56, 189, 248, 0.1));
            border: 1px solid rgba(20, 184, 166, 0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-teal);
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(20, 184, 166, 0.2);
        }

        .nav-btn {
            font-size: 0.82rem !important;
            font-weight: 600 !important;
            padding: 8px 16px !important;
            border-radius: var(--radius-pill) !important;
            transition: all 0.2s ease !important;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .nav-btn-ghost {
            background: rgba(148, 163, 184, 0.08);
            color: var(--text-primary) !important;
            border-color: var(--border-subtle);
        }
        .nav-btn-ghost:hover {
            background: rgba(148, 163, 184, 0.18);
            color: var(--text-heading) !important;
            border-color: var(--border-strong);
            transform: translateY(-1px);
        }

        /* ================= CARD FORM CONTAINER ================= */
        .form-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            max-width: 520px;
            margin: 40px auto;
        }

        .form-card-header {
            padding: 24px 32px;
            background: var(--bg-header);
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--accent-gold-glow);
            color: var(--accent-gold);
            border: 1px solid rgba(245, 158, 11, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .form-card-body {
            padding: 32px;
        }

        .form-label-custom {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .custom-input {
            background: var(--bg-input) !important;
            border: 1px solid var(--border-subtle) !important;
            color: var(--text-primary) !important;
            font-size: 0.9rem;
            border-radius: var(--radius-md) !important;
            padding: 12px 16px !important;
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            border-color: var(--accent-gold) !important;
            box-shadow: 0 0 0 3px var(--accent-gold-glow) !important;
            outline: none;
        }

        .btn-gold-submit {
            background: var(--accent-gold);
            color: #ffffff !important;
            font-weight: 700 !important;
            font-size: 0.9rem;
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            border: none;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.25);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-gold-submit:hover {
            background: #b45309;
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.4);
            transform: translateY(-1px);
        }

        .btn-ghost-back {
            background: rgba(148, 163, 184, 0.1);
            color: var(--text-primary) !important;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 12px 24px;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border-subtle);
            text-decoration: none;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .btn-ghost-back:hover {
            background: rgba(148, 163, 184, 0.2);
            color: var(--text-heading) !important;
            border-color: var(--border-strong);
        }
    </style>
</head>

<body>

    <!-- ================= FLOATING NAVBAR ================= -->
    <nav class="navbar navbar-expand-xl navbar-custom">
        <div class="container">
            <a class="brand-logo" href="/">
                <div class="brand-icon">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <span>SecureVault</span>
            </a>

            <div class="ms-auto d-flex align-items-center gap-2">
                <!-- Theme Toggle Button -->
                <button type="button" id="themeToggleBtn" class="nav-btn nav-btn-ghost" onclick="toggleTheme()">
                    <i class="bi bi-moon-stars-fill text-teal" id="themeIcon"></i>
                    <span id="themeText">Dark</span>
                </button>

                <a href="/profile" class="nav-btn nav-btn-ghost">
                    <i class="bi bi-arrow-left me-1"></i> Back to Profile
                </a>
            </div>
        </div>
    </nav>

    <!-- ================= FORM CONTAINER ================= -->
    <div class="container flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="form-card w-100">
            <div class="form-card-header">
                <div class="form-card-icon">
                    <i class="bi bi-key-fill"></i>
                </div>
                <div>
                    <h3 class="mb-0 fw-bold fs-5 text-heading">Change Password</h3>
                    <p class="text-secondary small mb-0">Update your account credentials safely</p>
                </div>
            </div>

            <div class="form-card-body">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label-custom">Current Password</label>
                        <div class="input-group">
                            <input
                                type="password"
                                name="current_password"
                                id="current_password"
                                class="form-control custom-input"
                                placeholder="Enter current password"
                                required>
                            <button class="btn btn-outline-secondary border-start-0" style="background: var(--bg-input); border-color: var(--border-subtle);" type="button" onclick="togglePasswordVisibility('current_password', this)">
                                <i class="bi bi-eye-slash text-muted"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">New Password</label>
                        <div class="input-group">
                            <input
                                type="password"
                                name="new_password"
                                id="new_password"
                                class="form-control custom-input"
                                placeholder="Enter new password"
                                required>
                            <button class="btn btn-outline-secondary border-start-0" style="background: var(--bg-input); border-color: var(--border-subtle);" type="button" onclick="togglePasswordVisibility('new_password', this)">
                                <i class="bi bi-eye-slash text-muted"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Confirm New Password</label>
                        <div class="input-group">
                            <input
                                type="password"
                                name="confirm_password"
                                id="confirm_password"
                                class="form-control custom-input"
                                placeholder="Confirm new password"
                                required>
                            <button class="btn btn-outline-secondary border-start-0" style="background: var(--bg-input); border-color: var(--border-subtle);" type="button" onclick="togglePasswordVisibility('confirm_password', this)">
                                <i class="bi bi-eye-slash text-muted"></i>
                            </button>
                        </div>
                    </div>

                    <div class="d-flex align-items-center gap-2 mt-4 pt-2">
                        <button type="submit" class="btn-gold-submit flex-grow-1">
                            <i class="bi bi-check-circle-fill"></i> Change Password
                        </button>

                        <a href="/profile" class="btn-ghost-back">
                            Back
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ================= FOOTER ================= -->
    <footer class="text-center py-4 border-top border-secondary border-opacity-10 text-muted fs-7 mt-auto">
        <div class="container">
            <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-2">
                <div>
                    <strong class="text-heading">SecureVault</strong> © 2026 — Password Management
                </div>
                <div class="d-flex align-items-center gap-3 text-muted fs-8">
                    <span><i class="bi bi-shield-lock-fill text-teal me-1"></i> End-to-End Encrypted</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dark / Light Theme & Password Toggle Script -->
    <script>
        function applyThemeUI(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            if (themeIcon && themeText) {
                if (theme === 'light') {
                    themeIcon.className = 'bi bi-sun-fill text-warning';
                    themeText.textContent = 'Light';
                } else {
                    themeIcon.className = 'bi bi-moon-stars-fill text-teal';
                    themeText.textContent = 'Dark';
                }
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyThemeUI(newTheme);
        }

        function togglePasswordVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'bi bi-eye text-teal';
            } else {
                input.type = 'password';
                icon.className = 'bi bi-eye-slash text-muted';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            applyThemeUI(currentTheme);
        });
    </script>
</body>

</html>
