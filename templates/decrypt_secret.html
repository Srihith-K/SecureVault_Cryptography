<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Decrypt File Secret - SecureVault</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        .file-name {
            background: #f1f3f5;
            padding: 12px;
            border-radius: 8px;
            margin: 20px 0;
        }

        textarea {
            width: 100%;
            min-height: 150px;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            resize: vertical;
            font-family: monospace;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .info {
            margin-top: 20px;
            padding: 15px;
            background: #fff7ed;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🔐 Decrypt File Secret</h1>

    <p>
        Enter the ciphertext you received in your SecureVault email.
    </p>

    <div class="file-name">

        <strong>File:</strong>

        {{ file.filename }}

    </div>

    <form method="POST">

        <label for="ciphertext">

            <strong>Encrypted Ciphertext</strong>

        </label>

        <br><br>

        <textarea
            id="ciphertext"
            name="ciphertext"
            placeholder="Paste the ciphertext from your email here..."
            required></textarea>

        <button type="submit">
            🔓 Decrypt & Verify
        </button>

    </form>

    <div class="info">

        <strong>Important:</strong>

        <ul>

            <li>
                The ciphertext is intended only for you.
            </li>

            <li>
                The access secret can only be used once.
            </li>

            <li>
                The share must not be expired or revoked.
            </li>

        </ul>

    </div>

</div>

</body>

</html>
