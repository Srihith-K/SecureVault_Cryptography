{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Edit Profile</h2>

<form method="POST" enctype="multipart/form-data">

    <div class="mb-3">
        <label class="form-label">Name</label>

        <input
            type="text"
            class="form-control"
            name="name"
            value="{{ user.name }}"
            required>
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>

        <input
            type="email"
            class="form-control"
            value="{{ user.email }}"
            readonly>
    </div>

    <div class="mb-3">
        <label class="form-label">Profile Picture</label>

        <input
            type="file"
            name="profile_picture"
            class="form-control"
            accept=".jpg,.jpeg,.png">
    </div>

        <button class="btn btn-primary">
            Save Changes
        </button>

        <a href="{{ url_for('profile') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
