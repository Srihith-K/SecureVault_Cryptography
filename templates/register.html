
<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | SecureVault</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Typography: Plus Jakarta Sans (UI & Display), JetBrains Mono (Data & Hashes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Immediate Theme Initialization Script (Prevents Flickering) -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme');
            const theme = savedTheme ? savedTheme : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <style>
        /* ================= THEME COLOR VARIABLES ================= */
        :root, [data-theme="dark"] {
            --bg-body: #060913;
            --bg-card: rgba(15, 23, 42, 0.55);
            --bg-card-hover: rgba(30, 41, 59, 0.65);
            --bg-glass: rgba(9, 13, 22, 0.75);
            --bg-input: rgba(9, 13, 22, 0.6);
            --bg-header: rgba(15, 23, 42, 0.4);

            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.18);

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-heading: #ffffff;

            --bg-gradient-overlay: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(20, 184, 166, 0.12), transparent),
                radial-gradient(circle at 100% 40%, rgba(99, 102, 241, 0.08), transparent 40%),
                radial-gradient(circle at 0% 80%, rgba(168, 85, 247, 0.06), transparent 40%),
                radial-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px);

            --brand-gradient: linear-gradient(135deg, #ffffff 30%, var(--accent-teal) 100%);
        }

        [data-theme="light"] {
            --bg-body: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-card-hover: rgba(255, 255, 255, 0.98);
            --bg-glass: rgba(255, 255, 255, 0.85);
            --bg-input: #ffffff;
            --bg-header: rgba(241, 245, 249, 0.8);

            --border-subtle: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.18);

            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --text-heading: #020617;

            --bg-gradient-overlay: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(20, 184, 166, 0.1), transparent),
                radial-gradient(circle at 100% 40%, rgba(99, 102, 241, 0.05), transparent 40%),
                radial-gradient(rgba(0, 0, 0, 0.03) 1px, transparent 1px);

            --brand-gradient: linear-gradient(135deg, #0f172a 30%, #0d9488 100%);
        }

        /* Brand Accent System */
        :root {
            --accent-teal: #14b8a6;
            --accent-teal-glow: rgba(20, 184, 166, 0.15);

            --accent-blue: #0284c7;
            --accent-gold: #d97706;

            --radius-xl: 20px;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-pill: 9999px;

            --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        /* Ambient background */
        body {
            background-color: var(--bg-body) !important;
            background-image: var(--bg-gradient-overlay);
            background-size: 100% 100%, 100% 100%, 100% 100%, 32px 32px;
            background-attachment: fixed;
            color: var(--text-primary) !important;
            font-family: var(--font-sans) !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
        }

        /* Responsive text colors in Light vs Dark mode */
        [data-theme="light"] .text-white {
            color: var(--text-heading) !important;
        }

        /* ================= FLOATING NAVBAR ================= */
        .navbar-custom {
            background: var(--bg-glass) !important;
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--border-subtle);
            padding: 12px 0 !important;
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background 0.3s ease, border-color 0.3s ease;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: -0.03em;
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2), rgba(56, 189, 248, 0.1));
            border: 1px solid rgba(20, 184, 166, 0.4);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-teal);
            font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(20, 184, 166, 0.2);
        }

        .nav-btn {
            font-size: 0.82rem !important;
            font-weight: 600 !important;
            padding: 8px 16px !important;
            border-radius: var(--radius-pill) !important;
            transition: all 0.2s ease !important;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            border: 1px solid transparent;
            cursor: pointer;
        }

        .nav-btn-ghost {
            background: rgba(148, 163, 184, 0.08);
            color: var(--text-primary) !important;
            border-color: var(--border-subtle);
        }
        .nav-btn-ghost:hover {
            background: rgba(148, 163, 184, 0.18);
            color: var(--text-heading) !important;
            border-color: var(--border-strong);
            transform: translateY(-1px);
        }

        /* ================= AUTH CARD ================= */
        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
            max-width: 520px;
            margin: 40px auto;
        }

        .auth-card-header {
            padding: 32px 32px 16px 32px;
            text-align: center;
        }

        .auth-icon-badge {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--accent-teal-glow);
            color: var(--accent-teal);
            border: 1px solid rgba(20, 184, 166, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            margin-bottom: 16px;
            box-shadow: 0 0 20px rgba(20, 184, 166, 0.2);
        }

        .form-label-custom {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .custom-input {
            background: var(--bg-input) !important;
            border: 1px solid var(--border-subtle) !important;
            color: var(--text-primary) !important;
            font-size: 0.9rem;
            border-radius: var(--radius-md) !important;
            padding: 12px 16px !important;
            transition: all 0.2s ease;
        }
        .custom-input:focus {
            border-color: var(--accent-teal) !important;
            box-shadow: 0 0 0 3px var(--accent-teal-glow) !important;
            outline: none;
        }

        .btn-teal-submit {
            background: var(--accent-teal);
            color: #ffffff !important;
            font-weight: 700 !important;
            font-size: 0.95rem;
            padding: 12px;
            border-radius: var(--radius-pill);
            border: none;
            box-shadow: 0 4px 14px rgba(20, 184, 166, 0.25);
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        .btn-teal-submit:hover {
            background: #0d9488;
            box-shadow: 0 6px 20px rgba(20, 184, 166, 0.4);
            transform: translateY(-1px);
        }

        /* Progress Strength Bar */
        .progress-strength {
            background: rgba(148, 163, 184, 0.15);
            border-radius: var(--radius-pill);
            height: 6px;
            overflow: hidden;
            margin-top: 8px;
        }
    </style>
</head>

<body>

    <!-- ================= FLOATING NAVBAR ================= -->
    <nav class="navbar navbar-expand-xl navbar-custom">
        <div class="container">
            <a class="brand-logo" href="/">
                <div class="brand-icon">
                    <i class="bi bi-shield-lock-fill"></i>
                </div>
                <span>SecureVault</span>
            </a>

            <div class="ms-auto d-flex align-items-center gap-2">
                <!-- Theme Toggle Button -->
                <button type="button" id="themeToggleBtn" class="nav-btn nav-btn-ghost me-2" onclick="toggleTheme()">
                    <i class="bi bi-moon-stars-fill text-teal" id="themeIcon"></i>
                    <span id="themeText">Dark</span>
                </button>

                <a href="/login" class="nav-btn nav-btn-ghost">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </a>
            </div>
        </div>
    </nav>

    <!-- ================= FORM CONTAINER ================= -->
    <div class="container flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="auth-card w-100">
            <div class="auth-card-header">
                <div class="auth-icon-badge">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h3 class="fw-bold text-heading mb-1">Create Your Account</h3>
                <p class="text-secondary small mb-0">Join SecureVault Zero-Knowledge Cloud</p>
            </div>

            <div class="card-body p-4 pt-2">
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label-custom">Full Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control custom-input"
                            placeholder="Enter your full name"
                            required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Email Address</label>
                        <input
                            type="email"
                            name="email"
                            class="form-control custom-input"
                            placeholder="Enter your email address"
                            required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label-custom">Password</label>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            class="form-control custom-input"
                            placeholder="Create a strong password"
                            required>

                        <div class="mt-2">
                            <div class="progress progress-strength">
                                <div
                                    id="strength-bar"
                                    class="progress-bar"
                                    role="progressbar"
                                    style="width: 0%;">
                                </div>
                            </div>
                            <div class="d-flex align-items-center justify-content-between mt-1">
                                <small class="text-muted fs-8">Password Complexity:</small>
                                <small id="strength-text" class="fw-bold font-mono fs-8 text-muted">Enter password</small>
                            </div>
                        </div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn-teal-submit">
                            <i class="bi bi-person-plus-fill"></i> Create Account
                        </button>
                    </div>
                </form>

                <hr class="my-4 border-secondary border-opacity-25">

                <div class="text-center text-muted small">
                    Already have an account? 
                    <a href="/login" class="text-teal text-decoration-none fw-bold ms-1">
                        Sign In Here
                    </a>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= FOOTER ================= -->
    <footer class="text-center py-4 border-top border-secondary border-opacity-10 text-muted fs-7 mt-auto">
        <div class="container">
            <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-2">
                <div>
                    <strong class="text-heading">SecureVault</strong> © 2026 — User Registration
                </div>
                <div class="d-flex align-items-center gap-3 text-muted fs-8">
                    <span><i class="bi bi-shield-check text-teal me-1"></i> Client-Side Encryption Setup</span>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Password Strength Engine & Theme Script -->
    <script>
        const password = document.getElementById("password");
        const bar = document.getElementById("strength-bar");
        const text = document.getElementById("strength-text");

        if (password) {
            password.addEventListener("input", function () {
                let value = password.value;
                let score = 0;

                if (value.length >= 8) score++;
                if (/[A-Z]/.test(value)) score++;
                if (/[a-z]/.test(value)) score++;
                if (/[0-9]/.test(value)) score++;
                if (/[!@#$%^&*(),.?":{}|<>]/.test(value)) score++;

                switch(score) {
                    case 0:
                    case 1:
                        bar.style.width = "20%";
                        bar.className = "progress-bar bg-danger";
                        text.innerHTML = "Weak";
                        text.className = "fw-bold font-mono fs-8 text-danger";
                        break;
                    case 2:
                        bar.style.width = "40%";
                        bar.className = "progress-bar bg-warning";
                        text.innerHTML = "Fair";
                        text.className = "fw-bold font-mono fs-8 text-warning";
                        break;
                    case 3:
                        bar.style.width = "60%";
                        bar.className = "progress-bar bg-info";
                        text.innerHTML = "Good";
                        text.className = "fw-bold font-mono fs-8 text-info";
                        break;
                    case 4:
                        bar.style.width = "80%";
                        bar.className = "progress-bar bg-primary";
                        text.innerHTML = "Strong";
                        text.className = "fw-bold font-mono fs-8 text-primary";
                        break;
                    case 5:
                        bar.style.width = "100%";
                        bar.className = "progress-bar bg-success";
                        text.innerHTML = "Very Strong";
                        text.className = "fw-bold font-mono fs-8 text-success";
                        break;
                }
            });
        }

        function applyThemeUI(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');
            if (themeIcon && themeText) {
                if (theme === 'light') {
                    themeIcon.className = 'bi bi-sun-fill text-warning';
                    themeText.textContent = 'Light';
                } else {
                    themeIcon.className = 'bi bi-moon-stars-fill text-teal';
                    themeText.textContent = 'Dark';
                }
            }
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyThemeUI(newTheme);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            applyThemeUI(currentTheme);
        });
    </script>
</body>

</html>
