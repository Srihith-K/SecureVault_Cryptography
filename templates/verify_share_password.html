{% extends "base.html" %}

{% block title %}Verify Share Password{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-lg border-0">

                <div class="card-header bg-danger text-white text-center">

                    <h3>
                        🔒 Protected Shared File
                    </h3>

                </div>

                <div class="card-body">

                    <p class="text-center">

                        This shared file is protected with a
                        <strong>Share Password</strong>.

                    </p>

                    <form method="POST">

                        <div class="mb-3">

                            <label class="form-label">
                                Enter Share Password
                            </label>

                            <input
                                type="password"
                                name="share_password"
                                class="form-control"
                                required
                            >

                        </div>

                        <button
                            class="btn btn-danger w-100">

                            Verify & Download

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
